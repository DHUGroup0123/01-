spring.application.name=01\u7535\u5546\u7cfb\u7edf
server.port=${SERVER_PORT:28089}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.thymeleaf.cache=false
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mall_01_full}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:mapper/**/*.xml
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
mall.upload-dir=${MALL_UPLOAD_DIR:./uploads}
server.error.include-message=never
server.error.include-stacktrace=never
