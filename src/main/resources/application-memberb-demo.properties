# Opt-in, B-only local demonstration. Requires the memberB/pom.xml launcher for H2.
spring.datasource.url=jdbc:h2:file:./member-b-data/demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
memberb.initialize=true
memberb.seed=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.address=127.0.0.1
