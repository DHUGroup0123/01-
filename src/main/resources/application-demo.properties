# Explicit local demonstration only. Data disappears when the process exits.
spring.datasource.url=jdbc:h2:mem:mall_01;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/V001__schema.sql
spring.sql.init.data-locations=classpath:db/V001__seed.sql
spring.sql.init.encoding=UTF-8
