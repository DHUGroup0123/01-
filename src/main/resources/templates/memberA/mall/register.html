<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>01电商系统 · 注册账号</title>
<link rel="stylesheet" th:href="@{/css/01-shop.css}">
<script defer th:src="@{/js/01-shop.js}">
</script>
</head>
<body data-page="register">
<header class="site-header">
<a class="brand" th:href="@{/}">
<span class="brand-icon">01</span>
<span>01电商系统<small>好物 · 日常 · 新体验</small>
</span>
</a>
<nav aria-label="主导航">
<a th:href="@{/}">首页</a>
<a th:href="@{/search}">全部商品</a>
<a th:if="${currentUser != null}" th:href="@{/personal}">个人中心</a>
<a th:if="${currentUser != null}" th:href="@{/personal/addresses}">收货地址</a>
<a th:if="${currentUser == null}" th:href="@{/login}">登录</a>
<a th:if="${currentUser == null}" class="nav-register" th:href="@{/register}">注册</a>
<button th:if="${currentUser != null}" type="button" class="link-button" data-logout>退出登录</button>
</nav>
</header>
<main>
<div class="auth-layout">
<section class="auth-story">
<p class="eyebrow">A FRESH START</p>
<h1>你的日常，<br>从这里开始。</h1>
<p>创建自己的账号，收货信息随时维护。</p>
<a th:href="@{/}">返回商城首页 →</a>
</section>
<section class="auth-card">
<h2>注册账号</h2>
<p>已有账号？<a th:href="@{/login}">去登录</a>
</p>
<form id="auth-form">
<label>账号<input name="loginName" required minlength="4" maxlength="32" pattern="[A-Za-z0-9_]{4,32}" autocomplete="username" placeholder="4–32 位字母、数字或下划线">
</label>
<label>密码<input type="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="8–72 位密码">
</label>
<label>图片验证码<span class="captcha-field">
<input name="captcha" required maxlength="8" autocomplete="off" placeholder="输入图片中的字符">
<button type="button" class="captcha-refresh" aria-label="刷新验证码">
<img id="captcha-image" th:src="@{/api/captcha}" alt="图片验证码，点击刷新">
</button>
</span>
</label>
<label>确认密码<input type="password" name="confirmPassword" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="再次输入密码">
</label>
<p class="form-message" id="form-message" role="alert">
</p>
<button class="primary full" type="submit">创建账号</button>
</form>
</section>
</div>
</main>
<footer>
<b>01电商系统</b>
<span>课程独立实践项目 · 支付仅为项目内演示</span>
<a th:href="@{/api/environment}">环境检查</a>
</footer>
<div id="global-message" role="status" aria-live="polite">
</div>
</body>
</html>
