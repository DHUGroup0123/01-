<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>01电商系统 · 商品详情</title>
<link rel="stylesheet" th:href="@{/css/01-shop.css}">
<script defer th:src="@{/js/01-shop.js}">
</script>
</head>
<body data-page="detail">
<header class="site-header">
<a class="brand" th:href="@{/}">
<span class="brand-icon">01</span>
<span>01电商系统<small>好物 · 日常 · 新体验</small>
</span>
</a>
<nav aria-label="主导航"><a th:href="@{/shop-cart}">购物车</a><a th:href="@{/orders}">我的订单</a><a th:href="@{/admin}">管理后台</a>
<a th:href="@{/}">首页</a>
<a th:href="@{/search}">全部商品</a>
<a th:if="${currentUser != null}" th:href="@{/personal}">个人中心</a>
<a th:if="${currentUser != null}" th:href="@{/personal/addresses}">收货地址</a>
<a th:if="${currentUser == null}" th:href="@{/login}">登录</a>
<a th:if="${currentUser == null}" class="nav-register" th:href="@{/register}">注册</a>
<button th:if="${currentUser != null}" type="button" class="link-button" data-logout>退出登录</button>
</nav>
</header>
<main>
<div class="breadcrumb">
<a th:href="@{/}">首页</a>
<span>/</span>
<a th:href="@{/search}">商品</a>
<span>/</span>
<span th:text="${product.productName}">
</span>
</div>
<section class="product-detail">
<div class="detail-art">
<img th:src="@{${product.coverUrl}}" th:alt="${product.productName}">
</div>
<div class="detail-copy">
<p class="eyebrow">01 SELECT / 商品详情</p>
<h1 th:text="${product.productName}">
</h1>
<p class="detail-summary" th:text="${product.summary}">
</p>
<div class="detail-price">
<strong th:text="'¥ ' + ${product.sellingPrice}">
</strong>
<del th:text="'¥ ' + ${product.originalPrice}">
</del>
</div>
<p class="stock" th:text="${product.stock > 0 ? '现货 · 库存 ' + product.stock + ' 件' : '暂时缺货'}">
</p>
<p class="notice">支付为课程演示流程，不会产生真实扣款。</p><label>购买数量<input id="purchase-count" type="number" min="1" max="5" value="1"></label><button class="primary" type="button" id="add-to-cart" th:attr="data-goods-id=${product.productId}" th:disabled="${product.stock &lt; 1}">加入购物车</button><a class="button secondary" th:href="@{/shop-cart}">查看购物车</a>
<a class="button primary" th:href="@{/personal/addresses}">管理收货地址</a>
<a class="button secondary" th:href="@{/search}">继续浏览</a>
</div>
</section>
<section class="detail-description">
<h2>商品介绍</h2>
<p class="pre-line" th:text="${product.detailText}">
</p>
</section>
</main>
<footer>
<b>01电商系统</b>
<span>课程独立实践项目 · 支付仅为项目内演示</span>
<a th:href="@{/api/environment}">环境检查</a>
</footer>
<div id="global-message" role="status" aria-live="polite">
</div>
</body>
</html>
