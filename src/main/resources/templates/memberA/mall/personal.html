<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>01电商系统 · 个人中心</title>
<link rel="stylesheet" th:href="@{/css/01-shop.css}">
<script defer th:src="@{/js/01-shop.js}">
</script>
</head>
<body data-page="personal">
<header class="site-header">
<a class="brand" th:href="@{/}">
<span class="brand-icon">01</span>
<span>01电商系统<small>好物 · 日常 · 新体验</small>
</span>
</a>
<nav aria-label="主导航"><a th:href="@{/shop-cart}">购物车</a><a th:href="@{/orders}">我的订单</a><a th:href="@{/admin}">管理后台</a>
<a th:href="@{/}">首页</a>
<a th:href="@{/search}">全部商品</a>
<a th:if="${currentUser != null}" th:href="@{/personal}">个人中心</a>
<a th:if="${currentUser != null}" th:href="@{/personal/addresses}">收货地址</a>
<a th:if="${currentUser == null}" th:href="@{/login}">登录</a>
<a th:if="${currentUser == null}" class="nav-register" th:href="@{/register}">注册</a>
<button th:if="${currentUser != null}" type="button" class="link-button" data-logout>退出登录</button>
</nav>
</header>
<main>
<div class="breadcrumb">
<a th:href="@{/}">首页</a>
<span>/</span>个人中心</div>
<div class="account-layout">
<aside class="account-nav">
<p class="eyebrow">MY ACCOUNT</p>
<h2>个人中心</h2>
<a class="selected" th:href="@{/personal}">个人资料</a>
<a th:href="@{/personal/addresses}">收货地址</a>
<button type="button" class="link-button" data-logout>退出登录</button>
</aside>
<section class="account-content">
<p class="eyebrow">PROFILE</p>
<h1>让我们认识你</h1>
<p class="muted">登录手机号不可修改，你可以维护昵称和个性签名。</p>
<form id="profile-form" class="edit-form">
<label>账号<input name="loginName" readonly autocomplete="username">
</label>
<label>昵称<input name="nickname" required maxlength="40" autocomplete="nickname">
</label>
<label>手机号<input name="phone" readonly type="tel" maxlength="11" pattern="1[3-9][0-9]{9}" autocomplete="tel" placeholder="可选，11 位中国大陆手机号">
</label>
<label>个性签名<textarea name="introduceSign" maxlength="100" rows="2"></textarea></label><p class="form-message" id="form-message" role="alert">
</p>
<button class="primary" type="submit">保存资料</button>
</form>
<a class="text-link" th:href="@{/personal/addresses}">管理我的收货地址 →</a>
</section>
</div>
</main>
<footer>
<b>01电商系统</b>
<span>课程独立实践项目 · 支付仅为项目内演示</span>
<a th:href="@{/api/environment}">环境检查</a>
</footer>
<div id="global-message" role="status" aria-live="polite">
</div>
</body>
</html>
