<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/commerce::head('确认订单')}"></head><body><header th:replace="~{layout/commerce::header}"></header><main><div class="breadcrumb"><a th:href="@{/shop-cart}">购物车</a> / 确认订单</div><section class="account-content"><p class="eyebrow">CHECKOUT</p><h1>确认这份期待</h1><h2>收货信息</h2><p class="shipping-info" th:text="${session.commerceUser.address}"></p><a class="text-link" th:href="@{/personal/addresses}">修改收货信息 →</a><table class="commerce-table"><thead><tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th></tr></thead><tbody><tr th:each="item:${myShoppingCartItems}" th:with="safeImage=${@assetPaths.image(item.goodsCoverImg)}"><td><a th:href="@{/products/{id}(id=${item.goodsId})}"><img class="cart-thumbnail" th:src="${safeImage}" alt="商品"><span th:text="${item.goodsName}"></span></a></td><td th:text="'¥ '+${item.sellingPrice}"></td><td th:text="${item.goodsCount}"></td><td th:text="'¥ '+${item.sellingPrice*item.goodsCount}"></td></tr></tbody></table><div class="checkout-summary"><strong th:text="'合计 ¥ '+${priceTotal}"></strong><form th:action="@{/saveOrder}" method="post"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button class="primary" type="submit">提交订单</button></form></div></section><p id="commerce-message" class="form-message" role="alert"></p></main><footer th:replace="~{layout/commerce::footer}"></footer></body></html>
