<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/commerce::head('购物车')}"></head><body><header th:replace="~{layout/commerce::header}"></header><main><div class="breadcrumb"><a th:href="@{/}">首页</a> / 购物车</div><section class="account-content"><p class="eyebrow">SHOPPING BAG</p><h1>心仪好物，准备带回家。</h1><div class="table-scroll"><table class="commerce-table"><thead><tr><th>商品</th><th>单价</th><th>数量</th><th>操作</th></tr></thead><tbody><tr th:each="item:${myShoppingCartItems}" th:with="safeImage=${@assetPaths.image(item.goodsCoverImg)}"><td><a th:href="@{/products/{id}(id=${item.goodsId})}"><img class="cart-thumbnail" th:src="${safeImage}" alt="商品"><span th:text="${item.goodsName}"></span></a></td><td th:text="'¥ '+${item.sellingPrice}"></td><td><input class="cart-quantity" type="number" min="1" max="5" th:value="${item.goodsCount}" th:attr="data-cart-id=${item.cartItemId}"></td><td><button class="secondary" data-cart-update th:attr="data-cart-id=${item.cartItemId}">更新数量</button><button class="danger-link" data-cart-delete th:attr="data-cart-id=${item.cartItemId}">移除</button></td></tr></tbody></table></div><p class="empty" th:if="${#lists.isEmpty(myShoppingCartItems)}">购物车还是空的，去挑选喜欢的商品吧。</p><div class="checkout-summary"><strong th:text="'合计 ¥ '+${priceTotal}"></strong><a class="button primary" th:if="${!#lists.isEmpty(myShoppingCartItems)}" th:href="@{/shop-cart/settle}">确认结算 →</a><a class="button secondary" th:href="@{/search}">继续浏览</a></div></section><p id="commerce-message" class="form-message" role="alert"></p></main><footer th:replace="~{layout/commerce::footer}"></footer></body></html>
