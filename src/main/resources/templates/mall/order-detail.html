<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/commerce::head('订单详情')}"></head><body><header th:replace="~{layout/commerce::header}"></header><main><div class="breadcrumb"><a th:href="@{/orders}">我的订单</a> / 订单详情</div><section class="account-content"><p class="eyebrow">ORDER DETAIL</p><h1 th:text="${orderDetailVO.orderStatusString}"></h1><p th:text="'订单号：'+${orderDetailVO.orderNo}"></p><p class="shipping-info" th:text="'收货信息：'+${orderDetailVO.userAddress}"></p><div class="order-line" th:each="item:${orderDetailVO.mallOrderItemVOS}"><a th:href="@{/products/{id}(id=${item.goodsId})}" th:text="${item.goodsName}"></a><span th:text="${item.sellingPrice}+'元 × '+${item.goodsCount}"></span></div><div class="checkout-summary"><strong th:text="'合计 ¥ '+${orderDetailVO.totalPrice}"></strong><a class="button primary" th:if="${orderDetailVO.orderStatus == 0}" th:href="@{/selectPayType(orderNo=${orderDetailVO.orderNo})}">演示支付</a><button class="secondary" th:if="${orderDetailVO.orderStatus == 0}" data-order-action="cancel" th:attr="data-order-no=${orderDetailVO.orderNo}">取消订单</button><button class="primary" th:if="${orderDetailVO.orderStatus == 3}" data-order-action="finish" th:attr="data-order-no=${orderDetailVO.orderNo}">确认收货</button><a class="button secondary" th:href="@{/orders}">返回订单</a></div></section><p id="commerce-message" class="form-message" role="alert"></p></main><footer th:replace="~{layout/commerce::footer}"></footer></body></html>
