<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/commerce::head('我的订单')}"></head><body><header th:replace="~{layout/commerce::header}"></header><main><div class="breadcrumb"><a th:href="@{/}">首页</a> / 我的订单</div><section class="account-content"><p class="eyebrow">MY ORDERS</p><h1>每一份订单，都值得期待。</h1><article class="order-card" th:each="order:${orderPageResult.list}"><div class="order-heading"><a th:href="@{/orders/{no}(no=${order.orderNo})}" th:text="'订单 '+${order.orderNo}"></a><span class="badge-inline" th:text="${order.orderStatusString}"></span></div><p th:text="'下单时间：'+${#dates.format(order.createTime,'yyyy-MM-dd HH:mm')}"></p><div class="order-line" th:each="item:${order.mallOrderItemVOS}"><span th:text="${item.goodsName}"></span><span th:text="${item.sellingPrice}+'元 × '+${item.goodsCount}"></span></div><div class="checkout-summary"><strong th:text="'合计 ¥ '+${order.totalPrice}"></strong><a class="button secondary" th:href="@{/orders/{no}(no=${order.orderNo})}">查看详情</a></div></article><p class="empty" th:if="${#lists.isEmpty(orderPageResult.list)}">还没有订单，去商城看看。</p><nav class="pagination"><a th:if="${orderPageResult.currPage > 1}" th:href="@{/orders(page=${orderPageResult.currPage - 1})}">上一页</a><span th:text="'第 '+${orderPageResult.currPage}+' 页'"></span><a th:if="${orderPageResult.currPage &lt; orderPageResult.totalPage}" th:href="@{/orders(page=${orderPageResult.currPage + 1})}">下一页</a></nav></section><p id="commerce-message" class="form-message" role="alert"></p></main><footer th:replace="~{layout/commerce::footer}"></footer></body></html>
