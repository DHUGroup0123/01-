<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" th:content="${csrf}"><title>01 商城 · 后台登录</title><link rel="stylesheet" href="/memberB/vendor/bootstrap.min.css"><link rel="stylesheet" href="/memberB/admin.css"></head>
<body class="login-screen"><main class="login-layout"><section class="login-story"><span class="brand-word">01 / COMMERCE</span><h1>让好商品，<br>被更多人看见。</h1><p>0123 组 · 商品与后台运营工作台</p><div class="story-line"></div><p class="small-note">分类 · 商品 · 首页运营 · 会员</p></section><section class="login-card"><span class="eyebrow">MEMBER B / ADMIN</span><h2>欢迎回来</h2><p class="muted">登录后管理商城商品与运营内容</p><form id="login-form"><label for="username">管理员账号</label><input class="form-control" id="username" name="username" autocomplete="username" required maxlength="50"><label for="password">密码</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><label for="captcha">图形验证码</label><div class="captcha-row"><input class="form-control" id="captcha" name="captcha" inputmode="numeric" maxlength="4" required autocomplete="off"><button type="button" id="refresh-captcha" title="点击刷新验证码"><img id="captcha-image" src="/admin/b/captcha" alt="四位数字验证码，点击刷新"></button></div><p id="login-error" role="alert" class="text-danger"></p><button class="btn btn-primary btn-block" type="submit">登录工作台</button></form><p class="small-note mt-4">管理员由部署者初始化；首次运行请查看成员 B 部署说明。</p></section></main><script src="/memberB/vendor/jquery.min.js"></script><script src="/memberB/login.js"></script></body></html>
